<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Микро-тесты математики — ЛР1</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #08111f; color: #eef4ff; }
    main { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    h1 { margin-bottom: 6px; }
    p { color: #9dabc3; }
    .summary { margin: 22px 0; padding: 14px 16px; border-radius: 12px; background: #101d30; border: 1px solid #263a59; }
    .test { margin: 8px 0; padding: 12px 14px; border-radius: 10px; background: #101d30; border: 1px solid #263a59; }
    .pass { border-color: #246846; }
    .fail { border-color: #8f3434; }
    .details { color: #9dabc3; font-family: Consolas, monospace; font-size: 13px; margin-top: 6px; }
    a { color: #8fb2ff; }
  </style>
</head>
<body>
  <main>
    <a href="../index.html">← Вернуться к приложению</a>
    <h1>Автоматические микро-тесты</h1>
    <p>Тесты используют те же функции Model, что и основное приложение. Внешние библиотеки тестирования и конвертации не применяются.</p>
    <div id="summary" class="summary">Выполнение...</div>
    <div id="results"></div>
  </main>

  <script src="../src/model/math.js"></script>
  <script src="../src/model/illuminants.js"></script>
  <script src="../src/model/gamut.js"></script>
  <script src="../src/model/rgb-xyz.js"></script>
  <script src="../src/model/xyz-lab.js"></script>
  <script src="../src/model/rgb-cmyk.js"></script>
  <script src="../src/model/color-model.js"></script>
  <script>
    const Lab = globalThis.ColorLab;
    const tests = [];

    const settings = {
      illuminant: 'D65',
      cmykAlgorithm: 'gcr',
      gamutStrategy: 'clipping',
      ucrShadowThreshold: 0.5
    };

    function add(name, fn) { tests.push({ name, fn }); }
    function close(actual, expected, tolerance) {
      if (!Number.isFinite(actual) || Math.abs(actual - expected) > tolerance) {
        throw new Error(`${actual} != ${expected}`);
      }
    }
    function closeVector(actual, expected, tolerance) {
      actual.forEach((value, index) => close(value, expected[index], tolerance));
    }

    add('Белая точка D65 соответствует методическому листу', () => {
      const white = Lab.Illuminants.whitePoint('D65', 100);
      closeVector(white, [95.047, 100, 108.883], 1e-10);
      return `XYZ = ${white.map((v) => v.toFixed(3)).join(', ')}`;
    });

    add('RGB(255, 0, 0) → LAB, D65', () => {
      const xyz = Lab.RgbXyz.rgbToXyz([255, 0, 0], 'D65');
      const lab = Lab.XyzLab.xyzToLab(xyz, 'D65');
      closeVector(lab, [53.2406, 80.0923, 67.2028], 0.03);
      return `LAB = ${lab.map((v) => v.toFixed(4)).join(', ')}`;
    });

    add('RGB(255, 0, 0) → CMYK, GCR/UCR', () => {
      ['gcr', 'ucr'].forEach((algorithm) => {
        const cmyk = Lab.RgbCmyk.rgbToCmyk([255, 0, 0], algorithm, 0.5);
        closeVector(cmyk, [0, 100, 100, 0], 1e-9);
      });
      return 'CMYK = 0, 100, 100, 0';
    });

    add('D65-матрица вычисляется и согласуется с коэффициентами из формул', () => {
      const matrix = Lab.Illuminants.calculateRgbXyzMatrices('D65').rgbToXyz;
      const supplied = [
        [0.412453, 0.357580, 0.180423],
        [0.212671, 0.715160, 0.072169],
        [0.019334, 0.119193, 0.950227]
      ];
      matrix.forEach((row, i) => closeVector(row, supplied[i], 0.0001));
      return 'Расхождение не превышает округление исходного листа';
    });

    add('Матрицы D65 / D50 / E пересчитываются независимо', () => {
      const values = ['D65', 'D50', 'E'].map((name) => Lab.Illuminants.calculateRgbXyzMatrices(name).rgbToXyz);
      if (JSON.stringify(values[0]) === JSON.stringify(values[1]) || JSON.stringify(values[1]) === JSON.stringify(values[2])) {
        throw new Error('Матрицы совпали');
      }
      return 'Три разные матрицы';
    });

    add('RGB → XYZ → RGB, D65/D50/E', () => {
      ['D65', 'D50', 'E'].forEach((name) => {
        const source = [42.25, 137.5, 219.75];
        const xyz = Lab.RgbXyz.rgbToXyz(source, name);
        const restored = Lab.RgbXyz.xyzToRgbRaw(xyz, name);
        closeVector(restored, source, 1e-7);
      });
      return 'Обратное преобразование корректно';
    });

    add('LAB → XYZ → LAB, D65/D50/E', () => {
      ['D65', 'D50', 'E'].forEach((name) => {
        const source = [55, 24, -36];
        const xyz = Lab.XyzLab.labToXyz(source, name);
        const restored = Lab.XyzLab.xyzToLab(xyz, name);
        closeVector(restored, source, 1e-8);
      });
      return 'Обратное преобразование корректно';
    });

    add('GCR и UCR различаются и сохраняют RGB', () => {
      const source = [35, 52, 61];
      const gcr = Lab.RgbCmyk.rgbToCmyk(source, 'gcr', 0.5);
      const ucr = Lab.RgbCmyk.rgbToCmyk(source, 'ucr', 0.5);
      if (!(gcr[3] > ucr[3])) throw new Error('GCR и UCR не различаются');
      closeVector(Lab.RgbCmyk.cmykToRgb(gcr), source, 1e-8);
      closeVector(Lab.RgbCmyk.cmykToRgb(ucr), source, 1e-8);
      return 'Оба алгоритма обратимы для контрольного цвета';
    });

    add('Clipping и Scaling работают по-разному', () => {
      const source = [-20, 120, 300];
      const clip = Lab.Gamut.mapRgb(source, 'clipping').rgb;
      const scale = Lab.Gamut.mapRgb(source, 'scaling').rgb;
      closeVector(clip, [0, 120, 255], 1e-12);
      closeVector(scale, [0, 111.5625, 255], 1e-10);
      return `Clipping=${clip.map((v) => v.toFixed(2))}; Scaling=${scale.map((v) => v.toFixed(2))}`;
    });

    add('После Clipping LAB и CMYK синхронизируются с фактическим RGB', () => {
      const local = { ...settings, illuminant: 'E' };
      const state = Lab.ColorModel.fromLab([67.2, 26.15, 74.63], local);
      if (!state.gamut.outOfGamut) throw new Error('Ожидался выход за RGB');
      const xyz = Lab.RgbXyz.rgbToXyz(state.rgb, 'E');
      const lab = Lab.XyzLab.xyzToLab(xyz, 'E');
      closeVector(state.xyz, xyz, 1e-9);
      closeVector(state.lab, lab, 1e-9);
      return `Итоговый LAB = ${state.lab.map((v) => v.toFixed(2)).join(', ')}`;
    });

    const results = document.getElementById('results');
    let passed = 0;
    tests.forEach((test) => {
      const element = document.createElement('div');
      element.className = 'test';
      try {
        const details = test.fn();
        passed += 1;
        element.classList.add('pass');
        element.innerHTML = `<strong>✓ ${test.name}</strong><div class="details">${details || ''}</div>`;
      } catch (error) {
        element.classList.add('fail');
        element.innerHTML = `<strong>✗ ${test.name}</strong><div class="details">${error.message}</div>`;
      }
      results.appendChild(element);
    });

    const summary = document.getElementById('summary');
    summary.textContent = `Пройдено: ${passed} из ${tests.length}`;
    summary.style.borderColor = passed === tests.length ? '#246846' : '#8f3434';
  </script>
</body>
</html>
